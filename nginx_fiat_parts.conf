server {
    # Porta padrão HTTP
    listen 80;
    
    # Substitua pelo domínio real que você vai usar (ex: eper.marcaseleta.com.br)
    server_name seudominio.com.br www.seudominio.com.br;

    # Se estiver rodando no mesmo servidor, o Flask está na porta 5002
    location / {
        proxy_pass http://127.0.0.1:5002;
        
        # Cabeçalhos importantes para repassar o IP real do usuário para o Flask
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;
        
        # Suporte para conexões de longa duração (evita timeout se o login do Playwright demorar)
        proxy_read_timeout 120s;
        proxy_connect_timeout 120s;
    }

    # Logs da aplicação (ajuste o caminho se estiver usando Windows ou num painel diferente)
    # Ubuntu/Linux padrão:
    access_log /var/log/nginx/fiat_parts_access.log;
    error_log /var/log/nginx/fiat_parts_error.log;
}
