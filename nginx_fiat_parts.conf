server {
    # Porta padrão HTTP
    listen 80;
    
    # Substitua pelo domínio real que você vai usar (ex: eper.marcaseleta.com.br)
    server_name app.marcaseleta.shop www.app.marcaseleta.shop;

    # Mapeia a URL /compatibilidade para o Flask porta 5002
    location /compatibilidade {
        proxy_pass http://127.0.0.1:5002/;
        
        # Cabeçalhos importantes para repassar o IP real do usuário para o Flask
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;
        
        # Suporte para consultas em lote (login Selenium + multiplas pecas)
        proxy_read_timeout 300s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
    }

    # Logs da aplicação (ajuste o caminho se estiver usando Windows ou num painel diferente)
    # Ubuntu/Linux padrão:
    access_log /var/log/nginx/fiat_parts_access.log;
    error_log /var/log/nginx/fiat_parts_error.log;
}
