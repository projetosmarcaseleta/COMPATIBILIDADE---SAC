server {
    # Porta padrão HTTP
    listen 80;
    
    # Substitua pelo domínio real que você vai usar (ex: eper.marcaseleta.com.br)
    server_name app.marcaseleta.shop www.app.marcaseleta.shop;

    # App principal
    location /compatibilidade {
        proxy_pass http://127.0.0.1:5002/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;
        proxy_read_timeout 300s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
    }

    # Tela de login (nova rota adicionada)
    location /login {
        proxy_pass http://127.0.0.1:5002/login;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
    }

    # API de status/controle de autenticação (novas rotas)
    location /api/ {
        proxy_pass http://127.0.0.1:5002/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
    }

    # Renovação manual de sessão
    location /refresh {
        proxy_pass http://127.0.0.1:5002/refresh;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
    }

    # Logs da aplicação (ajuste o caminho se estiver usando Windows ou num painel diferente)
    # Ubuntu/Linux padrão:
    access_log /var/log/nginx/fiat_parts_access.log;
    error_log /var/log/nginx/fiat_parts_error.log;
}
