name: Deploy Automático Hostinger

on:
  push:
    branches:
      - main  # Se o seu branch principal for 'master', troque aqui.

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Baixando o código do GitHub e Reiniciando VPS via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USERNAME }}
        key: ${{ secrets.VPS_SSH_KEY }}
        script: |
          # Garante que o Google Chrome e Xvfb estão instalados
          if ! command -v google-chrome &> /dev/null; then
            echo "Instalando Google Chrome..."
            wget -q -O /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
            apt-get install -y /tmp/chrome.deb || apt-get install -fy
            rm /tmp/chrome.deb
          fi
          apt-get install -y xvfb 2>/dev/null || true
          cd ~/projetos/COMPATIBILIDADE---SAC
          git fetch --all
          git reset --hard origin/main
          git clean -df
          source venv/bin/activate
          pip install -r requirements.txt
          pm2 restart fiat-eper
